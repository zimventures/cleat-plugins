name: Publish plugin index

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'tools/build.py'
      - '.github/workflows/publish.yml'
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

# Only one concurrent deploy across all runs — GitHub Pages serializes
# deploys anyway, but this avoids queueing up duplicate runs.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Build docs site
        # mkdocs writes the static site into _site/ (index.html, theme
        # assets, every page from docs/). Has to run before build.py
        # because mkdocs wipes its site_dir before writing.
        run: mkdocs build --strict

      - name: Build zips + aggregated index.json
        run: |
          # build.py writes _site/zips/<id>-vX.Y.Z.zip and
          # _site/index.json on top of the mkdocs output. It only
          # touches those two paths so the docs site survives intact.
          # Final Pages layout served at https://zimventures.github.io/cleat-plugins/:
          #   /                  -> docs site (mkdocs index.html)
          #   /api/ssh/, ...     -> docs pages
          #   /index.json        -> registry index (cleat clients fetch this)
          #   /zips/<id>-vX.Y.Z.zip -> built plugin archives
          python tools/build.py --out _site \
            --base-url "https://zimventures.github.io/cleat-plugins/"
          echo "--- index.json preview ---"
          head -c 500 _site/index.json
          echo
          echo "--- zips/ listing ---"
          ls -la _site/zips/
          echo "--- _site/ top-level listing ---"
          ls _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
