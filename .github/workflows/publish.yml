name: Publish plugin index

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'tools/aggregate.py'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

# Only one concurrent deploy across all runs — GitHub Pages serializes
# deploys anyway, but this avoids queueing up duplicate runs.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build aggregated index.json
        run: |
          mkdir -p _site
          python tools/aggregate.py > _site/index.json
          echo "--- index.json preview ---"
          head -c 500 _site/index.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
