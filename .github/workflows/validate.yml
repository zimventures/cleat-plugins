name: Validate plugin manifests

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'tools/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'tools/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # validate.py has no third-party dependencies — it lints the
      # manifest + the plugin.lua source. CI builds the zips and hashes
      # them itself (see publish.yml + tools/build.py), so there's no
      # source_url to download here.

      - name: Validate every plugin entry
        run: python tools/validate.py
